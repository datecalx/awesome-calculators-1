  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#202938" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#f3f4f6" rx="112" />
  <rect width="304" height="400" x="104" y="56" fill="url(#body)" rx="48" />
  <rect width="240" height="96" x="136" y="92" fill="#d1fae5" rx="20" /><text x="352" y="154" fill="#047857"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="43" font-weight="700"
    text-anchor="end">999.99</text>
  <g fill="#f9fafb">
